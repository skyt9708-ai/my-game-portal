<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전통 고누놀이 한마당</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gowun Batang', 'Noto Serif KR', serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .wood-board {
      background: radial-gradient(circle at 50% 40%, #eed5aa 0%, #dab076 60%, #b37e3d 100%);
      box-shadow: 
        inset 0 0 50px rgba(78, 42, 11, 0.4),
        0 15px 35px rgba(0, 0, 0, 0.4),
        0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .hanji-bg {
      background-color: #f7f3ea;
      background-image: radial-gradient(#d6cec1 1px, transparent 1px);
      background-size: 24px 24px;
    }
    @keyframes pulse-ring {
      0% { r: 16px; opacity: 0.95; }
      70% { r: 26px; opacity: 0; }
      100% { r: 26px; opacity: 0; }
    }
    .pulse-target {
      animation: pulse-ring 1.3s infinite cubic-bezier(0.2, 0.6, 0.3, 1);
    }
    @keyframes pulse-wheel {
      0% { r: 17px; opacity: 1; stroke-width: 4px; }
      50% { r: 26px; opacity: 0.35; stroke-width: 2px; }
      100% { r: 17px; opacity: 1; stroke-width: 4px; }
    }
    .pulse-wheel-target {
      animation: pulse-wheel 1.1s infinite ease-in-out;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .wheel-rotate-cw {
      transform-origin: center;
      animation: spin-slow 14s linear infinite;
    }
    .wheel-rotate-ccw {
      transform-origin: center;
      animation: spin-slow 14s linear infinite reverse;
    }
/* [좌측 이동 가능한 메인 탭 스타일] */
    #drag-home-tab {
      position: fixed !important;
      top: 42%;
      left: 0 !important;
      z-index: 2147483645 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 10px 12px 10px 14px !important;
      background-color: rgba(15, 23, 42, 0.92) !important;
      color: #f8fafc !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      border-radius: 0 12px 12px 0 !important;
      border: 1px solid rgba(148, 163, 184, 0.3) !important;
      border-left: none !important;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.45) !important;
      cursor: pointer !important;
      touch-action: none !important;
      transform: translateX(calc(-100% + 40px));
      transition: transform 0.22s ease-out, color 0.2s ease;
    }
    #drag-home-tab:hover {
      transform: translateX(0) !important;
      color: #818cf8 !important;
    }
    #drag-home-tab * {
      pointer-events: none !important;
    }
  </style>
</head>
<body class="hanji-bg text-stone-800 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4">
<!-- [좌측 플로팅 메인으로 이동 버튼] -->
  <div id="drag-home-tab" title="위아래로 드래그 이동 / 클릭 시 메인 포털로 이동">
    <span>메인으로</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  </div>
<!-- [메인으로 나가기 확인 모달] -->
  <div id="exit-modal-dim" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2147483647] hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl">
      <div class="text-4xl mb-3">⚠️</div>
      <h3 class="text-lg font-bold text-white mb-2">메인으로 이동할까요?</h3>
      <p class="text-sm text-slate-400 mb-6 leading-relaxed">
        작도 별점과 클리어 기록은 기기에 자동 저장됩니다. 메인 화면으로 돌아가시겠습니까?
      </p>
      <div class="flex gap-3">
        <button id="btn-cancel-exit" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition">계속 탐구하기</button>
        <button id="btn-confirm-exit" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-sm transition">나가기</button>
      </div>
    </div>
  </div>
  <header class="w-full max-w-xl flex flex-col items-center gap-2 mb-2">
    <div class="flex items-center justify-between w-full px-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🪵</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-amber-950 font-serif">전통 고누놀이 한마당</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="soundToggleBtn" class="px-3 py-1.5 rounded-lg border border-amber-800/30 bg-amber-100 hover:bg-amber-200 text-sm font-semibold transition flex items-center gap-1 text-amber-900 shadow-sm" title="음향 토글">
          <span id="soundIcon">🔔</span>
        </button>
        <button id="ruleModalBtn" class="px-3 py-1.5 rounded-lg border border-amber-900/40 bg-amber-800 text-amber-50 hover:bg-amber-900 text-sm font-medium transition shadow-sm flex items-center gap-1">
          <span>📜</span>
          <span>놀이 규칙</span>
        </button>
      </div>
    </div>

    <!-- 6 Game Modes Selector Grid -->
    <div class="grid grid-cols-3 sm:grid-cols-6 gap-1 w-full bg-stone-300/70 p-1.5 rounded-xl border border-stone-400/40 shadow-inner">
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="umul">
        우물고누
        <span class="block text-[9px] font-normal opacity-75">(포위)</span>
      </button>
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="hobak">
        호박고누
        <span class="block text-[9px] font-normal opacity-75">(포위)</span>
      </button>
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="bat">
        밭고누
        <span class="block text-[9px] font-normal opacity-75">(사방포위)</span>
      </button>
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="jul">
        줄고누
        <span class="block text-[9px] font-normal opacity-75">(협공포획)</span>
      </button>
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="bakwi">
        바퀴고누
        <span class="block text-[9px] font-normal opacity-75">(쾌속포획)</span>
      </button>
      <button class="mode-tab py-1.5 px-0.5 rounded-lg text-xs font-bold transition text-stone-700 text-center" data-game="cham">
        참고누
        <span class="block text-[9px] font-normal opacity-75">(정렬포획)</span>
      </button>

  </header>

  <main class="w-full max-w-xl flex flex-col items-center flex-grow">
    <!-- Score & Turn Banner -->
    <div class="w-full bg-amber-50/90 border border-amber-800/30 rounded-xl p-2 sm:p-2.5 shadow-sm mb-2 flex items-center justify-between">
      <div id="p1Card" class="flex items-center gap-2 px-2.5 py-1 rounded-lg transition border-2 border-transparent">
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-blue-700 shadow-md border-2 border-white flex items-center justify-center text-[10px] text-white font-bold">청</div>
        <div class="text-left leading-tight">
          <div class="text-xs font-bold text-blue-900">청말 (선수)</div>
          <div class="text-xs font-semibold text-stone-600"><span id="p1Score">0</span>승 <span id="p1PieceCount" class="text-[11px] text-blue-800"></span></div>
        </div>
      </div>

      <div class="flex flex-col items-center text-center px-1">
        <div id="turnBadge" class="px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm mb-0.5 bg-blue-600 text-white">청말 차례</div>
        <div id="statusSubtext" class="text-[11px] text-stone-600 font-medium line-clamp-1">말을 선택하여 이동하세요</div>
      </div>

      <div id="p2Card" class="flex items-center gap-2 px-2.5 py-1 rounded-lg transition border-2 border-transparent">
        <div class="text-right leading-tight">
          <div class="text-xs font-bold text-red-900">홍말 (후수)</div>
          <div class="text-xs font-semibold text-stone-600"><span id="p2Score">0</span>승 <span id="p2PieceCount" class="text-[11px] text-red-800"></span></div>
        </div>
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-red-400 to-red-700 shadow-md border-2 border-white flex items-center justify-center text-[10px] text-white font-bold">홍</div>
      </div>
    </div>

    <!-- Wooden Board Container -->
    <div class="relative w-full aspect-square max-w-[440px] wood-board rounded-2xl border-4 border-amber-950/80 p-2 sm:p-3 flex items-center justify-center">
      <div class="absolute inset-1.5 border border-amber-950/20 rounded-xl pointer-events-none"></div>
      <!-- Interactive SVG Board -->
      <svg id="gameBoardSvg" class="w-full h-full filter drop-shadow-sm" viewBox="0 0 400 400"></svg>
    </div>

    <div class="w-full max-w-xl flex items-center justify-between gap-2 mt-2 px-1">
      <div class="text-xs text-stone-500 font-medium"><span id="turnCounter">제 1수</span></div>
      <div class="flex items-center gap-2">
        <button id="undoBtn" class="px-3 py-1.5 rounded-lg border border-stone-400 bg-stone-100 hover:bg-stone-200 text-xs font-bold text-stone-700 transition disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1 shadow-sm">
          ↩ 무르기
        </button>
        <button id="restartBtn" class="px-3 py-1.5 rounded-lg border border-amber-800/40 bg-amber-800 hover:bg-amber-900 text-xs font-bold text-amber-50 transition shadow-sm flex items-center gap-1">
          🔄 새 판 시작
        </button>
      </div>
    </div>
  </main>

  <footer class="mt-2 text-[11px] text-stone-500 text-center">
    화면을 마주보고 번갈아 두는 한국 전통 2인용 대국 보드게임입니다.
  </footer>

  <!-- Modal: Game Rules -->
  <div id="ruleModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-[#fcfaf6] border-2 border-amber-900/60 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="bg-amber-900 text-amber-50 p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-xl">📜</span>
          <h2 id="modalTitle" class="text-base sm:text-lg font-bold">고누놀이 규칙 안내</h2>
        </div>
        <button id="closeModalBtn" class="text-amber-200 hover:text-white text-xl font-bold px-2 py-0.5 rounded">✕</button>
      </div>
      <div id="modalContent" class="p-4 sm:p-5 overflow-y-auto space-y-4 text-xs sm:text-sm text-stone-800 leading-relaxed font-sans"></div>
      <div class="p-3 bg-stone-100 border-t border-stone-300 flex justify-end">
        <button id="modalConfirmBtn" class="px-4 py-1.5 bg-amber-800 hover:bg-amber-900 text-amber-50 font-bold rounded-lg text-xs sm:text-sm shadow">
          확인하고 대국하기
        </button>
      </div>
    </div>
  </div>

  <!-- Winner Celebration Overlay -->
  <div id="winOverlay" class="fixed inset-0 bg-stone-950/70 z-40 flex items-center justify-center p-4 hidden">
    <div class="bg-[#fcfaf6] border-4 border-amber-800 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl">
      <div id="winBadgeIcon" class="text-5xl mb-2">🎉</div>
      <h3 id="winTitle" class="text-xl font-bold text-amber-950 mb-1">청말 대승!</h3>
      <p id="winReason" class="text-xs text-stone-600 mb-5 leading-normal">상대방의 모든 길이 막혔습니다.</p>
      <div class="flex flex-col gap-2">
        <button id="newMatchBtn" class="w-full py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-bold rounded-xl text-sm shadow">
          한 판 더 하기
        </button>
        <button id="closeWinOverlayBtn" class="w-full py-2 bg-stone-200 hover:bg-stone-300 text-stone-800 font-semibold rounded-xl text-xs">
          말판 살펴보기
        </button>
      </div>
    </div>
  </div>

  <script>
    class GonuAudio {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playStone() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.09);
      }
      playWheelSwoop() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(200, now);
        osc1.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        osc1.frequency.exponentialRampToValueAtTime(150, now + 0.3);
        gain1.gain.setValueAtTime(0.5, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc1.connect(gain1); gain1.connect(this.ctx.destination);
        osc1.start(now); osc1.stop(now + 0.32);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(450, now + 0.15);
        osc2.frequency.exponentialRampToValueAtTime(90, now + 0.3);
        gain2.gain.setValueAtTime(0.6, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc2.connect(gain2); gain2.connect(this.ctx.destination);
        osc2.start(now + 0.15); osc2.stop(now + 0.32);
      }
      playCapture() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.18);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.19);
      }
      playWin() {
        if (!this.enabled) return;
        this.init();
        const notes = [261.6, 329.6, 392.0, 523.3, 659.2];
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.09;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.3);
        });
      }
    }
    const audio = new GonuAudio();

    const GONU_RULES_DATA = {
      umul: { title: "우물고누", tag: "2인 각 말 2개", summary: "말 2개로 시작하여 상대방의 두 말을 모두 움직이지 못하게 가두면 승리합니다.", rules: ["청말(좌상)과 홍말(우하) 위치에서 시작합니다.", "직선과 둥근 바깥 호를 따라 빈 곳으로 1칸씩 이동합니다.", "상대방 말이 갈 곳이 없게 포위(외통수)하면 승리합니다."] },
      hobak: { title: "호박고누", tag: "2인 각 말 3개", summary: "둥근 호박 모양의 판에서 상대를 구석에 가두면 승리합니다.", rules: ["진지 이탈 후 후퇴 금지: 자기 진지(집)에서 한번 나온 말은 후퇴할 수 없습니다.", "상대 진지에 진입한 말은 밖으로 나올 수 없습니다.", "선 따라 이동하며 상대 말 3개를 움직일 수 없게 만들면 승리합니다."] },
      bat: { title: "밭고누 (사방고누)", tag: "2인 각 말 3개", summary: "밭 전(田)자 9칸에서 상대방의 말 3개를 포위하는 순수 지혜 싸움입니다.", rules: ["청말은 위쪽 줄에 3개, 홍말은 아래쪽 줄에 3개 배치하여 시작합니다.", "중앙 가로줄이 비워진 상태로 시작하며, 선을 따라 빈자리로 1칸씩 움직입니다.", "상대의 모든 말이 움직일 수 없게 묶어버리면 승리합니다."] },
      jul: { title: "줄고누", tag: "2인 각 말 4개 (협공포획)", summary: "상하좌우로 이동하여 내 말 2개로 상대 말 1개를 양쪽에서 끼워 협공하면 따냅니다.", rules: ["협공 포획: [내 말 - 상대 말 - 내 말] 형태로 감싸면 상대 말을 잡습니다.", "스스로 자기 발로 내 두 말 사이에 들어간 자살수는 잡히지 않습니다.", "상대 말을 전부 잡거나 가두면 승리합니다."] },
      bakwi: { title: "바퀴고누", tag: "2인 각 말 4개", summary: "네 귀퉁이의 수레바퀴를 연속으로 타고 돌아 직선로를 질주하며 상대를 잡아냅니다.", rules: ["일반 이동: 선을 따라 전후좌우로 1칸씩 이동합니다.", "바퀴 이동: 귀퉁이의 바퀴를 한 번 돌아나온 뒤 원하는 빈칸만큼 끝까지 직진할 수 있습니다. (도중에 방향 꺾기 불가)", "연속 바퀴: 길이 뚫려있다면 한 수에 바퀴를 두 번 이상 연속으로 타고 도약할 수 있습니다.", "상대 말을 잡는 것은 오직 바퀴 이동으로만 가능하며, 상대를 잡으면 그 자리에 멈춥니다."] },
      cham: { title: "참고누", tag: "2인 각 말 12개 (정렬포획)", summary: "말을 번갈아 놓다가 가로/세로 3개가 일직선('곤')이 되면 상대 말을 하나씩 따내는 최고 난도 고누입니다.", rules: ["1단계(착수): 돌을 번갈아 12개 놓으며 3개 일직선이 되면 상대를 따냅니다.", "2단계(이동): 선을 따라 1칸씩 이동하며 3개 일직선을 만들 때마다 상대를 따냅니다."] }
    };

    function getGameBoardConfig(gameType) {
      if (gameType === 'umul') {
        return {
          nodes: [
            { id:0, x:200, y:60, label:"상" }, { id:1, x:60, y:200, label:"좌" }, 
            { id:2, x:200, y:340, label:"하" }, { id:3, x:340, y:200, label:"우" }, 
            { id:4, x:200, y:200, label:"중앙" }
          ],
          lines: [[0,4], [1,4], [2,4], [3,4], [0,1], [1,2], [0,3]],
          initialPieces: { p1: [0, 1], p2: [2, 3] }, specialRules: 'umul'
        };
      } 
      else if (gameType === 'hobak') {
        // 정통 호박고누 말판:
        // 위쪽 진영(p1): 0(좌), 1(중), 2(우) - 가로선 [0,1], [1,2] 및 진출선 [1,3]
        // 중앙 호박(원형): 3(상), 4(좌), 5(중앙), 6(우), 7(하) - 원 둘레 및 내부 十자선 [3,5],[5,7],[4,5],[5,6]
        // 아래쪽 진영(p2): 8(좌), 9(중), 10(우) - 가로선 [8,9], [9,10] 및 진출선 [7,9]
        return {
          nodes: [
            { id:0, x:120, y:52, camp:'p1' }, { id:1, x:200, y:52, camp:'p1' }, { id:2, x:280, y:52, camp:'p1' },
            { id:3, x:200, y:128, camp:'neutral' },
            { id:4, x:128, y:200, camp:'neutral' }, { id:5, x:200, y:200, camp:'neutral' }, { id:6, x:272, y:200, camp:'neutral' },
            { id:7, x:200, y:272, camp:'neutral' },
            { id:8, x:120, y:348, camp:'p2' }, { id:9, x:200, y:348, camp:'p2' }, { id:10, x:280, y:348, camp:'p2' }
          ],
          lines: [
            // 위쪽 진영 선
            [0,1], [1,2], [1,3],
            // 중앙 십자(+)선
            [3,5], [5,7], [4,5], [5,6],
            // 원 둘레 인접 연결
            [3,4], [4,7], [7,6], [6,3],
            // 아래쪽 진영 선
            [7,9], [8,9], [9,10]
          ],
          initialPieces: { p1: [0, 1, 2], p2: [8, 9, 10] }, specialRules: 'hobak'
        };
      } 
      else if (gameType === 'bat') {
        const nodes = [], lines = [], coords = [100, 200, 300];
        for(let r=0; r<3; r++) {
          for(let c=0; c<3; c++) {
            const id = r*3+c; nodes.push({id, x:coords[c], y:coords[r], r, c});
            if(c<2) lines.push([id, id+1]); if(r<2) lines.push([id, id+3]);
          }
        }
        return { nodes, lines, initialPieces: { p1: [0, 1, 2], p2: [6, 7, 8] }, specialRules: 'bat' };
      }
      else if (gameType === 'jul') {
        const nodes = [], lines = [];
        for(let r=0; r<4; r++) {
          for(let c=0; c<4; c++) {
            const id = r*4+c; nodes.push({id, x: 70+c*86, y: 70+r*86, r, c});
            if(c<3) lines.push([id, id+1]); if(r<3) lines.push([id, id+4]);
          }
        }
        return { nodes, lines, initialPieces: { p1: [0,1,2,3], p2: [12,13,14,15] }, specialRules: 'jul' };
      }
      else if (gameType === 'bakwi') {
        // 5x5 격자(4x4 정사각형, 25개 점) - 첨부된 교본 사진과 완벽 일치
        const nodes = [], lines = [];
        for(let r=0; r<5; r++) {
          for(let c=0; c<5; c++) {
            const id = r*5+c; 
            nodes.push({id, x: 80 + c*60, y: 80 + r*60, r, c});
            if(c<4) lines.push([id, id+1]); 
            if(r<4) lines.push([id, id+5]);
          }
        }
        // 청말 4개 좌상단, 홍말 4개 우하단 배치
        return { nodes, lines, initialPieces: { p1: [0,1,5,6], p2: [18,19,23,24] }, specialRules: 'bakwi' };
      }
      else {
        const nodes = [], lines = [], millTriplets = [];
        [{r:155, off:0}, {r:105, off:8}, {r:55, off:16}].forEach(ring => {
          const cx=200, cy=200, d=ring.r, o=ring.off;
          nodes.push({id:o+0, x:cx-d, y:cy-d}, {id:o+1, x:cx, y:cy-d}, {id:o+2, x:cx+d, y:cy-d}, {id:o+3, x:cx+d, y:cy}, {id:o+4, x:cx+d, y:cy+d}, {id:o+5, x:cx, y:cy+d}, {id:o+6, x:cx-d, y:cy+d}, {id:o+7, x:cx-d, y:cy});
          lines.push([o+0,o+1],[o+1,o+2],[o+2,o+3],[o+3,o+4],[o+4,o+5],[o+5,o+6],[o+6,o+7],[o+7,o+0]);
          millTriplets.push([o+0,o+1,o+2],[o+2,o+3,o+4],[o+4,o+5,o+6],[o+6,o+7,o+0]);
        });
        lines.push([1,9],[9,17], [3,11],[11,19], [5,13],[13,21], [7,15],[15,23]);
        millTriplets.push([1,9,17], [3,11,19], [5,13,21], [7,15,23]);
        return { nodes, lines, millTriplets, initialPieces: { p1: [], p2: [] }, piecesToPlace: 12, specialRules: 'cham' };
      }
    }

    function buildAdjacency(config) {
      const adj = {}; config.nodes.forEach(n => adj[n.id] = []);
      config.lines.forEach(([u, v]) => { adj[u].push(v); adj[v].push(u); });
      return adj;
    }

    let currentMode = 'bakwi', boardConfig = null, adjacency = {}, scores = { p1: 0, p2: 0 };
    let state = { turn: 'p1', moveCount: 1, phase: 'move', selectedNode: null, pieces: { p1: [], p2: [] }, placedCount: { p1: 0, p2: 0 }, winner: null, winReason: '', history: [] };
    function getNodeOwner(nodeId) { return state.pieces.p1.includes(nodeId) ? 'p1' : (state.pieces.p2.includes(nodeId) ? 'p2' : null); }

    // 5x5 바퀴고누 궤적 규정 (사진의 두 번째 선 연결 구조)
    const BAKWI_LOOPS = [
      {
        id: 'NW',
        entryA: 1,  inDirA: [-1, 0], exitA: 5,  outDirA: [0, 1],  // (0,1) UP -> (1,0) RIGHT
        entryB: 5,  inDirB: [0, -1], exitB: 1,  outDirB: [1, 0],  // (1,0) LEFT -> (0,1) DOWN
      },
      {
        id: 'NE',
        entryA: 3,  inDirA: [-1, 0], exitA: 9,  outDirA: [0, -1], // (0,3) UP -> (1,4) LEFT
        entryB: 9,  inDirB: [0, 1],  exitB: 3,  outDirB: [1, 0],  // (1,4) RIGHT -> (0,3) DOWN
      },
      {
        id: 'SW',
        entryA: 21, inDirA: [1, 0],  exitA: 15, outDirA: [0, 1],  // (4,1) DOWN -> (3,0) RIGHT
        entryB: 15, inDirB: [0, -1], exitB: 21, outDirB: [-1, 0], // (3,0) LEFT -> (4,1) UP
      },
      {
        id: 'SE',
        entryA: 23, inDirA: [1, 0],  exitA: 19, outDirA: [0, -1], // (4,3) DOWN -> (3,4) LEFT
        entryB: 19, inDirB: [0, 1],  exitB: 23, outDirB: [-1, 0], // (3,4) RIGHT -> (4,3) UP
      }
    ];

    function calculateBakwiMoves(startId, player) {
      const moves = [];
      const opponent = player === 'p1' ? 'p2' : 'p1';

      // 바퀴를 탈출한 후 직선 질주 및 연속 바퀴를 처리하는 재귀 함수
      function sprintFrom(exitR, exitC, dr, dc, currentVisited) {
        let currR = exitR;
        let currC = exitC;

        // 먼저 바퀴 출구 지점 자체를 확인 (장애물/포획 여부)
        let exitId = currR * 5 + currC;
        let owner = getNodeOwner(exitId);
        
        if (owner === player) {
          return; // 출구에 아군이 있으면 바퀴를 빠져나올 수 없음
        } else if (owner === opponent) {
          moves.push({ targetId: exitId, isWheel: true, isCapture: true, capturedId: exitId });
          return; // 출구에 적이 있으면 덮치고 멈춤
        }
        
        // 빈칸이면 정지할 수도 있고 이어서 질주할 수도 있음
        moves.push({ targetId: exitId, isWheel: true, isCapture: false });
        
        // 직진 질주
        while (true) {
          currR += dr;
          currC += dc;
          if (currR < 0 || currR > 4 || currC < 0 || currC > 4) break;
          
          let currentId = currR * 5 + currC;
          let currentOwner = getNodeOwner(currentId);

          if (currentOwner === player) {
            break; // 아군을 넘을 수 없음
          } else if (currentOwner === opponent) {
            moves.push({ targetId: currentId, isWheel: true, isCapture: true, capturedId: currentId });
            break; // 적을 저격하고 멈춤
          }
          
          moves.push({ targetId: currentId, isWheel: true, isCapture: false });
          
          // 질주 도중 또 다른 바퀴 입구를 만났는지 검사 (연속 바퀴)
          let loopToEnter = null;
          for (let loop of BAKWI_LOOPS) {
            if (currentVisited.has(loop.id)) continue;
            if (currentId === loop.entryA && dr === loop.inDirA[0] && dc === loop.inDirA[1]) {
              loopToEnter = { exit: loop.exitA, outDr: loop.outDirA[0], outDc: loop.outDirA[1], id: loop.id };
            } else if (currentId === loop.entryB && dr === loop.inDirB[0] && dc === loop.inDirB[1]) {
              loopToEnter = { exit: loop.exitB, outDr: loop.outDirB[0], outDc: loop.outDirB[1], id: loop.id };
            }
          }

          if (loopToEnter) {
            let nextVisited = new Set(currentVisited);
            nextVisited.add(loopToEnter.id);
            // 연속 바퀴 가속 진입
            sprintFrom(Math.floor(loopToEnter.exit / 5), loopToEnter.exit % 5, loopToEnter.outDr, loopToEnter.outDc, nextVisited);
            break; // 직진은 멈추고 새로운 궤도로 전환
          }
        }
      }

      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let startR = Math.floor(startId / 5);
      let startC = startId % 5;

      dirs.forEach(([dr, dc]) => {
         // 1. 이미 바퀴 입구에 서 있는 상태에서 바퀴 방향으로 이동하여 진입
         for (let loop of BAKWI_LOOPS) {
           if (startId === loop.entryA && dr === loop.inDirA[0] && dc === loop.inDirA[1]) {
             sprintFrom(Math.floor(loop.exitA / 5), loop.exitA % 5, loop.outDirA[0], loop.outDirA[1], new Set([loop.id]));
           } else if (startId === loop.entryB && dr === loop.inDirB[0] && dc === loop.inDirB[1]) {
             sprintFrom(Math.floor(loop.exitB / 5), loop.exitB % 5, loop.outDirB[0], loop.outDirB[1], new Set([loop.id]));
           }
         }

         // 2. 일반 1칸 이동 (바퀴 진입 전제 조건)
         let nextR = startR + dr;
         let nextC = startC + dc;
         if (nextR >= 0 && nextR <= 4 && nextC >= 0 && nextC <= 4) {
            let nextId = nextR * 5 + nextC;
            let owner = getNodeOwner(nextId);
            
            // 이동할 1칸이 비어있어야만 이동 및 진입 가능 (넘어가거나 적 밟기 금지)
            if (owner === null) {
               // 일반 1칸 이동 기록 (포획 불가)
               moves.push({ targetId: nextId, isWheel: false, isCapture: false });
               
               // 3. 1칸 이동한 위치가 바퀴 입구고 방향이 일치하면, 관성에 의해 바퀴 진입
               for (let loop of BAKWI_LOOPS) {
                 if (nextId === loop.entryA && dr === loop.inDirA[0] && dc === loop.inDirA[1]) {
                   sprintFrom(Math.floor(loop.exitA / 5), loop.exitA % 5, loop.outDirA[0], loop.outDirA[1], new Set([loop.id]));
                 } else if (nextId === loop.entryB && dr === loop.inDirB[0] && dc === loop.inDirB[1]) {
                   sprintFrom(Math.floor(loop.exitB / 5), loop.exitB % 5, loop.outDirB[0], loop.outDirB[1], new Set([loop.id]));
                 }
               }
            }
         }
      });

      // 중복 제거 (일반 이동과 바퀴 이동이 겹치면 바퀴 우선 등)
      const uniqueMoves = [];
      moves.forEach(m => {
        if (m.targetId === startId) return;
        const exist = uniqueMoves.find(u => u.targetId === m.targetId);
        if (!exist) {
          uniqueMoves.push(m);
        } else if (!exist.isCapture && m.isCapture) {
          exist.isCapture = true;
          exist.capturedId = m.capturedId;
        } else if (!exist.isWheel && m.isWheel) {
          exist.isWheel = true;
        }
      });

      return uniqueMoves;
    }

    function getAllLegalMoves(fromId, player) {
      if (currentMode === 'bakwi') {
         return calculateBakwiMoves(fromId, player);
      }
      const moves = [];
      const neighbors = adjacency[fromId] || [];
      // 1. 일반 인접 1칸 이동
      neighbors.forEach(toId => {
        if (getNodeOwner(toId) === null) {
          if (currentMode === 'hobak') {
            const fromC = boardConfig.nodes[fromId].camp, toC = boardConfig.nodes[toId].camp;
            if (player === 'p1' && fromC !== 'p1' && toC === 'p1') return;
            if (player === 'p2' && fromC !== 'p2' && toC === 'p2') return;
          }
          moves.push({ targetId: toId, isWheel: false, isCapture: false });
        }
      });
      // 2. 바퀴고누 원거리 가속 및 연쇄 회전 저격 기능 추가
      if (currentMode === 'bakwi') calculateBakwiMoves(fromId, player).forEach(bm => moves.push(bm));
      return moves;
    }

    function checkJulCaptures(movedToId, player) {
      if (currentMode !== 'jul') return [];
      const opponent = player === 'p1' ? 'p2' : 'p1';
      const node = boardConfig.nodes[movedToId];
      const captured = [];
      [[0,1], [0,-1], [1,0], [-1,0]].forEach(([dr, dc]) => {
        const midR = node.r + dr, midC = node.c + dc, endR = node.r + 2*dr, endC = node.c + 2*dc;
        if (midR>=0 && midR<4 && midC>=0 && midC<4 && endR>=0 && endR<4 && endC>=0 && endC<4) {
          const midId = midR*4+midC, endId = endR*4+endC;
          if (getNodeOwner(midId) === opponent && getNodeOwner(endId) === player) captured.push(midId);
        }
      });
      return captured;
    }

    function initGame(mode) {
      currentMode = mode; boardConfig = getGameBoardConfig(mode); adjacency = buildAdjacency(boardConfig);
      state = { turn: 'p1', moveCount: 1, phase: mode === 'cham' ? 'place' : 'move', selectedNode: null, pieces: { p1: [...boardConfig.initialPieces.p1], p2: [...boardConfig.initialPieces.p2] }, placedCount: { p1: 0, p2: 0 }, winner: null, winReason: '', history: [] };
      document.getElementById('winOverlay').classList.add('hidden');
      updateUI(); renderBoard();
    }

    function pushHistory() {
      state.history.push(JSON.stringify({ turn: state.turn, moveCount: state.moveCount, phase: state.phase, pieces: { p1: [...state.pieces.p1], p2: [...state.pieces.p2] }, placedCount: { ...state.placedCount } }));
      if (state.history.length > 40) state.history.shift();
    }

    function triggerWin(winner, reason) {
      state.winner = winner; state.winReason = reason; scores[winner]++; audio.playWin();
      document.getElementById('winBadgeIcon').textContent = winner === 'p1' ? '🔵 👑' : '🔴 👑';
      document.getElementById('winTitle').textContent = `${winner === 'p1' ? '청말' : '홍말'} 승리!`;
      document.getElementById('winReason').textContent = reason;
      document.getElementById('winOverlay').classList.remove('hidden');
      updateUI(); renderBoard();
    }

    function passTurn() {
      state.turn = state.turn === 'p1' ? 'p2' : 'p1'; state.moveCount++;
      if (state.phase === 'move') {
        let hasMove = state.pieces[state.turn].some(id => getAllLegalMoves(id, state.turn).length > 0);
        if (!hasMove) triggerWin(state.turn === 'p1' ? 'p2' : 'p1', `상대방이 더 이상 둘 수 있는 길이 완전히 막혔습니다 (외통수)!`);
      }
      updateUI(); renderBoard();
    }

    function handleNodeClick(nodeId) {
      if (state.winner) return;
      const player = state.turn, opponent = player === 'p1' ? 'p2' : 'p1', owner = getNodeOwner(nodeId);

      if (state.phase === 'capture' && owner === opponent) {
        pushHistory(); state.pieces[opponent] = state.pieces[opponent].filter(id => id !== nodeId); audio.playCapture();
        if (state.phase === 'move' && state.pieces[opponent].length < 3) return triggerWin(player, `상대의 말이 부족해졌습니다!`);
        state.phase = (currentMode === 'cham' && (state.placedCount.p1 < 12 || state.placedCount.p2 < 12)) ? 'place' : 'move';
        return passTurn();
      }

      if (state.phase === 'place' && owner === null) {
        pushHistory(); state.pieces[player].push(nodeId); state.placedCount[player]++; audio.playStone();
        if (boardConfig.millTriplets.some(t => t.includes(nodeId) && t.every(id => state.pieces[player].includes(id)))) {
          state.phase = 'capture'; updateUI(); return renderBoard();
        }
        if (state.placedCount.p1 >= 12 && state.placedCount.p2 >= 12) state.phase = 'move';
        return passTurn();
      }

      if (state.phase === 'move') {
        if (owner === player) { state.selectedNode = state.selectedNode === nodeId ? null : nodeId; return renderBoard(); }
        if (state.selectedNode !== null) {
          const move = getAllLegalMoves(state.selectedNode, player).find(m => m.targetId === nodeId);
          if (move) {
            pushHistory();
            if (move.isCapture) state.pieces[opponent] = state.pieces[opponent].filter(id => id !== nodeId);
            state.pieces[player][state.pieces[player].indexOf(state.selectedNode)] = nodeId;
            
            if (move.isWheel) audio.playWheelSwoop();
            else if (move.isCapture) audio.playCapture();
            else audio.playStone();

            if (currentMode === 'bakwi' && state.pieces[opponent].length === 0) return triggerWin(player, `바퀴 저격으로 상대를 완벽히 제압했습니다!`);
            if (currentMode === 'jul') {
              const cap = checkJulCaptures(nodeId, player);
              if (cap.length > 0) {
                state.pieces[opponent] = state.pieces[opponent].filter(id => !cap.includes(id)); audio.playCapture();
                if (state.pieces[opponent].length === 0) return triggerWin(player, `상대를 모두 협공 포획했습니다!`);
              }
            }
            if (currentMode === 'cham' && boardConfig.millTriplets.some(t => t.includes(nodeId) && t.every(id => state.pieces[player].includes(id)))) {
              state.selectedNode = null; state.phase = 'capture'; updateUI(); return renderBoard();
            }
            state.selectedNode = null; passTurn();
          }
        }
      }
    }

    function renderBoard() {
      const svg = document.getElementById('gameBoardSvg'); svg.innerHTML = '';
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <radialGradient id="blueStoneGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#93c5fd" /><stop offset="35%" stop-color="#2563eb" /><stop offset="100%" stop-color="#0f172a" /></radialGradient>
        <radialGradient id="redStoneGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fca5a5" /><stop offset="35%" stop-color="#dc2626" /><stop offset="100%" stop-color="#450a0a" /></radialGradient>
        <filter id="insetShadow"><feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#451a03" flood-opacity="0.45" /></filter>
      `; svg.appendChild(defs);

      const linesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      linesGroup.setAttribute('stroke', '#5c310c'); linesGroup.setAttribute('stroke-width', '4.5'); linesGroup.setAttribute('stroke-linecap', 'round'); linesGroup.setAttribute('filter', 'url(#insetShadow)');
      
      if (currentMode === 'hobak') {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '200'); circle.setAttribute('cy', '200'); circle.setAttribute('r', '72'); circle.setAttribute('fill', 'none'); circle.setAttribute('stroke', '#5c310c'); circle.setAttribute('stroke-width', '4.5'); linesGroup.appendChild(circle);
      }
      if (currentMode === 'umul') {
        const umulArc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        // 우물고누: 우측에서 상단, 좌측을 거쳐 하단으로 이어지는 270도 곡선
        umulArc.setAttribute('d', 'M 340,200 A 140,140 0 0,0 200,60 A 140,140 0 0,0 60,200 A 140,140 0 0,0 200,340');
        umulArc.setAttribute('fill', 'none'); umulArc.setAttribute('stroke', '#5c310c');
        umulArc.setAttribute('stroke-width', '4.5'); umulArc.setAttribute('stroke-linecap', 'round');
        linesGroup.appendChild(umulArc);
      }
      if (currentMode === 'bakwi') {
        // 5x5 격자의 2번 선을 연결하는 정확한 위치의 바퀴 루프
        const loops = [
          { d: 'M 140,80 A 60,60 0 1,0 80,140' },  // 좌상 루프 (바깥 반시계방향 270도)
          { d: 'M 260,80 A 60,60 0 1,1 320,140' }, // 우상 루프
          { d: 'M 140,320 A 60,60 0 1,1 80,260' }, // 좌하 루프
          { d: 'M 260,320 A 60,60 0 1,0 320,260' }  // 우하 루프
        ];

        loops.forEach(l => {
          const track = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          track.setAttribute('d', l.d);
          track.setAttribute('fill', 'none'); 
          track.setAttribute('stroke', '#5c310c'); 
          track.setAttribute('stroke-width', '4.5');
          linesGroup.appendChild(track);

          // 이동 경로 시각화를 돕는 점선 가이드
          const guide = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          guide.setAttribute('d', l.d);
          guide.setAttribute('fill', 'none'); 
          guide.setAttribute('stroke', '#d97706');
          guide.setAttribute('stroke-width', '2.5'); 
          guide.setAttribute('stroke-dasharray', '5 4'); 
          guide.setAttribute('opacity', '0.7');
          linesGroup.appendChild(guide);
        });
      }

      boardConfig.lines.forEach(([u, v]) => {
        // 우물고누의 호(Arc) 부분은 위에서 별도로 그렸으므로 직계선 렌더링 스킵
        if (currentMode === 'umul' && ((u===0&&v===1) || (u===1&&v===2) || (u===0&&v===3) || (u===1&&v===0) || (u===2&&v===1) || (u===3&&v===0))) return;
        // 호박고누의 원호(Circle) 둘레는 circle 엘리먼트로 렌더링하므로 둘레 직선 스킵
        if (currentMode === 'hobak' && ((u===3&&v===4) || (u===4&&v===7) || (u===7&&v===6) || (u===6&&v===3) || (u===4&&v===3) || (u===7&&v===4) || (u===6&&v===7) || (u===3&&v===6))) return;
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', boardConfig.nodes[u].x); line.setAttribute('y1', boardConfig.nodes[u].y); line.setAttribute('x2', boardConfig.nodes[v].x); line.setAttribute('y2', boardConfig.nodes[v].y); linesGroup.appendChild(line);
      });
      svg.appendChild(linesGroup);

      const legalMoves = (state.selectedNode !== null && state.phase === 'move') ? getAllLegalMoves(state.selectedNode, state.turn) : [];

      boardConfig.nodes.forEach(node => {
        const owner = getNodeOwner(node.id), isSelected = state.selectedNode === node.id, isCap = state.phase === 'capture' && owner === (state.turn === 'p1' ? 'p2' : 'p1');
        
        // 이동 가능 칸 시각화 (바퀴 이동을 최우선으로 렌더링하여 경로 생략 방지)
        let matchedMove = legalMoves.find(m => m.targetId === node.id && m.isCapture);
        if (!matchedMove) matchedMove = legalMoves.find(m => m.targetId === node.id && m.isWheel);
        if (!matchedMove) matchedMove = legalMoves.find(m => m.targetId === node.id);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.style.cursor = 'pointer'; g.onclick = () => handleNodeClick(node.id);
        
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); hitArea.setAttribute('cx', node.x); hitArea.setAttribute('cy', node.y); hitArea.setAttribute('r', '26'); hitArea.setAttribute('fill', 'transparent'); g.appendChild(hitArea);
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('cx', node.x); dot.setAttribute('cy', node.y); dot.setAttribute('r', '5.5'); dot.setAttribute('fill', '#451a03'); g.appendChild(dot);

        if (matchedMove) {
          if (matchedMove.isWheel) {
            const wr = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); wr.setAttribute('cx', node.x); wr.setAttribute('cy', node.y); wr.setAttribute('r', '20'); wr.setAttribute('fill', 'none'); wr.setAttribute('stroke', matchedMove.isCapture ? '#dc2626' : '#d97706'); wr.setAttribute('stroke-width', '3.5'); wr.setAttribute('class', 'pulse-wheel-target'); g.appendChild(wr);
            const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text'); badge.setAttribute('x', node.x); badge.setAttribute('y', node.y + (matchedMove.isCapture ? -23 : 24)); badge.setAttribute('text-anchor', 'middle'); badge.setAttribute('fill', matchedMove.isCapture ? '#b91c1c' : '#b45309'); badge.setAttribute('font-size', '10.5'); badge.setAttribute('font-weight', 'bold'); badge.textContent = matchedMove.isCapture ? '⚔ 저격!' : '⚡ 질주'; g.appendChild(badge);
          } else {
            const tr = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); tr.setAttribute('cx', node.x); tr.setAttribute('cy', node.y); tr.setAttribute('r', '17'); tr.setAttribute('fill', 'none'); tr.setAttribute('stroke', '#16a34a'); tr.setAttribute('stroke-width', '3'); tr.setAttribute('stroke-dasharray', '4 2'); tr.setAttribute('class', 'pulse-target'); g.appendChild(tr);
          }
        }

        if (owner) {
          const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); shadow.setAttribute('cx', node.x+2); shadow.setAttribute('cy', node.y+3); shadow.setAttribute('r', '18'); shadow.setAttribute('fill', 'rgba(0,0,0,0.36)'); g.appendChild(shadow);
          const stone = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); stone.setAttribute('cx', node.x); stone.setAttribute('cy', node.y); stone.setAttribute('r', '18'); stone.setAttribute('fill', owner === 'p1' ? 'url(#blueStoneGrad)' : 'url(#redStoneGrad)'); stone.setAttribute('stroke', owner === 'p1' ? '#60a5fa' : '#f87171'); stone.setAttribute('stroke-width', '1.5'); g.appendChild(stone);
          if (isSelected) {
            const sr = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); sr.setAttribute('cx', node.x); sr.setAttribute('cy', node.y); sr.setAttribute('r', '23'); sr.setAttribute('fill', 'none'); sr.setAttribute('stroke', '#fbbf24'); sr.setAttribute('stroke-width', '3.5'); g.appendChild(sr);
          }
          if (isCap) {
            const cr = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); cr.setAttribute('cx', node.x); cr.setAttribute('cy', node.y); cr.setAttribute('r', '23'); cr.setAttribute('fill', 'none'); cr.setAttribute('stroke', '#ef4444'); cr.setAttribute('stroke-width', '3.5'); cr.setAttribute('class', 'pulse-target'); g.appendChild(cr);
          }
        }
        svg.appendChild(g);
      });
    }

    function updateUI() {
      document.getElementById('p1Score').textContent = scores.p1; document.getElementById('p2Score').textContent = scores.p2;
      document.getElementById('turnCounter').textContent = `제 ${state.moveCount}수`;
      const turnB = document.getElementById('turnBadge'), subTxt = document.getElementById('statusSubtext');
      if (state.turn === 'p1') {
        document.getElementById('p1Card').classList.add('border-blue-600', 'bg-blue-100/60'); document.getElementById('p2Card').classList.remove('border-red-600', 'bg-red-100/60');
        turnB.className = 'px-3 py-0.5 rounded-full text-xs font-bold shadow-sm mb-0.5 bg-blue-600 text-white'; turnB.textContent = '청말 차례';
      } else {
        document.getElementById('p2Card').classList.add('border-red-600', 'bg-red-100/60'); document.getElementById('p1Card').classList.remove('border-blue-600', 'bg-blue-100/60');
        turnB.className = 'px-3 py-0.5 rounded-full text-xs font-bold shadow-sm mb-0.5 bg-red-600 text-white'; turnB.textContent = '홍말 차례';
      }

      subTxt.className = 'text-[11px] font-medium text-stone-600 line-clamp-1';
      if (state.phase === 'capture') { subTxt.textContent = '✨ 따낼 상대 말을 누르세요'; subTxt.className = 'text-[11px] font-bold text-red-600 line-clamp-1'; }
      else if (currentMode === 'bakwi') { subTxt.textContent = state.selectedNode ? '이동 지점 선택 (황금점: 바퀴 질주/저격)' : '모서리 바퀴를 향해 질주할 말을 선택하세요'; subTxt.className = 'text-[11px] font-bold text-amber-900 line-clamp-1'; }
      else { subTxt.textContent = state.selectedNode ? '초록색 점으로 이동하세요' : '움직일 말을 선택하세요'; }

      document.getElementById('undoBtn').disabled = state.history.length === 0 || state.winner !== null;
      document.querySelectorAll('.mode-tab').forEach(t => {
        if (t.dataset.game === currentMode) { t.classList.add('bg-amber-900', 'text-amber-50', 'shadow'); t.classList.remove('text-stone-700'); }
        else { t.classList.remove('bg-amber-900', 'text-amber-50', 'shadow'); t.classList.add('text-stone-700'); }
      });
    }

    document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => { if (tab.dataset.game !== currentMode) initGame(tab.dataset.game); }));
    document.getElementById('undoBtn').addEventListener('click', () => { if(state.history.length>0) { const prev=JSON.parse(state.history.pop()); state=Object.assign(state, prev); document.getElementById('winOverlay').classList.add('hidden'); audio.playStone(); updateUI(); renderBoard(); }});
    document.getElementById('restartBtn').addEventListener('click', () => initGame(currentMode));
    document.getElementById('newMatchBtn').addEventListener('click', () => initGame(currentMode));
    document.getElementById('closeWinOverlayBtn').addEventListener('click', () => document.getElementById('winOverlay').classList.add('hidden'));
    document.getElementById('soundToggleBtn').addEventListener('click', () => { audio.enabled = !audio.enabled; document.getElementById('soundIcon').textContent = audio.enabled ? '🔔' : '🔕'; document.getElementById('soundToggleBtn').classList.toggle('opacity-50', !audio.enabled); });
    
    document.getElementById('ruleModalBtn').addEventListener('click', () => {
      const data = GONU_RULES_DATA[currentMode];
      document.getElementById('modalTitle').textContent = data.title + " 규칙";
      document.getElementById('modalContent').innerHTML = `<div class="p-2.5 bg-amber-100/80 border border-amber-900/20 rounded-xl mb-3"><span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-amber-800 text-amber-50 mb-1">${data.tag}</span><p class="font-bold text-amber-950">${data.summary}</p></div><ul class="list-disc pl-5 space-y-1.5 text-stone-700">${data.rules.map(r=>`<li>${r}</li>`).join('')}</ul>`;
      document.getElementById('ruleModal').classList.remove('hidden'); setTimeout(() => document.getElementById('ruleModal').classList.remove('opacity-0'), 10);
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('ruleModal').classList.add('opacity-0'); setTimeout(() => document.getElementById('ruleModal').classList.add('hidden'), 200); });
    document.getElementById('modalConfirmBtn').addEventListener('click', () => document.getElementById('closeModalBtn').click());

    window.onload = () => initGame('bakwi');
// [좌측 메인으로 탭 드래그 및 이동 이벤트 로직]
    (function initPortalReturnTab() {
      const tab = document.getElementById("drag-home-tab");
      const modal = document.getElementById("exit-modal-dim");
      const btnCancel = document.getElementById("btn-cancel-exit");
      const btnExit = document.getElementById("btn-confirm-exit");

      let isDragging = false;
      let startY = 0;
      let initialTop = 0;
      let moveDistance = 0;

      const getY = e => (e.touches && e.touches.length ? e.touches[0].clientY : e.clientY);

      function handleDown(e) {
        isDragging = true;
        moveDistance = 0;
        startY = getY(e);
        initialTop = tab.getBoundingClientRect().top;
        e.stopPropagation();
      }

      function handleMove(e) {
        if (!isDragging) return;
        const deltaY = getY(e) - startY;
        moveDistance = Math.abs(deltaY);
        let newTop = Math.max(16, Math.min(window.innerHeight - tab.offsetHeight - 16, initialTop + deltaY));
        tab.style.top = newTop + "px";
        e.stopPropagation();
      }

      function handleUp(e) {
        if (!isDragging) return;
        isDragging = false;
        // 드래그가 아닌 단순 클릭(이동거리 8px 미만)인 경우에만 모달 표시
        if (moveDistance < 8) {
          modal.classList.remove("hidden");
          modal.classList.add("flex");
        }
        e.stopPropagation();
      }

      tab.addEventListener("mousedown", handleDown, true);
      tab.addEventListener("touchstart", handleDown, { passive: false, capture: true });
      window.addEventListener("mousemove", handleMove, true);
      window.addEventListener("touchmove", handleMove, { passive: false, capture: true });
      window.addEventListener("mouseup", handleUp, true);
      window.addEventListener("touchend", handleUp, true);

      // 모달 닫기
      btnCancel.addEventListener("click", () => {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      });

      // 메인 페이지로 이동 (원하는 파일 경로로 변경 가능)
      btnExit.addEventListener("click", () => {
        window.location.href = "../index.html";
      });
    })();
  </script>
</body>
