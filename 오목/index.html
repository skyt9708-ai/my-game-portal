<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>렌주룰 오목 (Renju Omok)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
    }
    .board-wood {
      background: #dfb173;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4), inset 0 0 40px rgba(119, 75, 23, 0.35);
    }
    .stone-black {
      background: radial-gradient(circle at 35% 35%, #555 0%, #111 60%, #000 100%);
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.6), inset -1px -1px 3px rgba(255, 255, 255, 0.2);
    }
    .stone-white {
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e6e6e6 65%, #c8c8c8 100%);
      box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.4), inset -1px -1px 3px rgba(0, 0, 0, 0.15);
    }
    .grid-line {
      background-color: #61401b;
    }
    @keyframes toast-in-out {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
    .animate-toast {
      animation: toast-in-out 2.5s forwards ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 토스트 알림창 (금수 착수 시 안내) -->
  <div id="toast" class="hidden fixed top-6 left-1/2 z-50 px-5 py-3 rounded-xl bg-red-600/95 text-white font-semibold text-sm shadow-2xl backdrop-blur-sm border border-red-400 pointer-events-none transition-all"></div>

  <div class="max-w-4xl w-full flex flex-col lg:flex-row gap-8 items-center justify-center">
    
    <!-- 오목판 영역 -->
    <div class="relative p-5 rounded-2xl board-wood border-4 border-amber-950 flex-shrink-0">
      <div id="board" class="relative" style="width: 504px; height: 504px;">
        <!-- 격자선 및 교차점은 JS로 생성 -->
      </div>
    </div>

    <!-- 대시보드 및 컨트롤러 -->
    <div class="flex flex-col gap-5 w-full max-w-sm">
      
      <!-- 헤더 정보 -->
      <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-xl">
        <h1 class="text-2xl font-bold tracking-tight text-amber-400 mb-1">렌주룰 오목</h1>
        <p class="text-xs text-slate-400">흑은 3-3, 4-4, 6목 이상 착수 불가 (4-3 승리 가능)</p>

        <!-- 현재 차례 상태 -->
        <div class="mt-4 flex items-center justify-between p-3.5 bg-slate-900/60 rounded-xl border border-slate-700/60">
          <div class="flex items-center gap-3">
            <div id="turn-indicator" class="w-6 h-6 rounded-full stone-black transition-all duration-200"></div>
            <span id="turn-text" class="font-bold text-sm">흑돌 차례</span>
          </div>
          <span id="move-count" class="text-xs font-medium text-slate-400">0 수 진행</span>
        </div>
      </div>

      <!-- 게임 모드 선택 -->
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex gap-2">
        <button id="btn-mode-pvp" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition">2인 플레이</button>
        <button id="btn-mode-ai" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition">AI 대전 (흑)</button>
      </div>

      <!-- 작업 버튼 -->
      <div class="flex gap-3">
        <button id="btn-undo" class="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 font-semibold text-sm transition active:scale-95 border border-slate-600">무르기</button>
        <button id="btn-reset" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 font-semibold text-sm transition active:scale-95 shadow-lg shadow-rose-950/40">새 게임</button>
      </div>

      <!-- 복기 컨트롤 패널 (게임 종료 시 활성화) -->
      <div id="review-panel" class="hidden bg-indigo-950/70 p-4 rounded-2xl border border-indigo-500/40 shadow-xl space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            게임 복기 모드
          </span>
          <span id="review-step-indicator" class="text-xs text-indigo-200 font-medium">0 / 0 수</span>
        </div>
        <div class="flex gap-2">
          <button id="btn-review-prev" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-xs transition active:scale-95">◀ 이전 수</button>
          <button id="btn-review-next" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-xs transition active:scale-95">다음 수 ▶</button>
        </div>
        <button id="btn-exit-review" class="w-full py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">복기 종료하기</button>
      </div>

      <!-- 룰 안내 카드 -->
      <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 text-xs text-slate-300 space-y-1.5 leading-relaxed">
        <div class="font-semibold text-amber-300">💡 렌주룰 안내</div>
        <div>• <span class="text-red-400 font-medium">흑돌 금수:</span> 3-3, 4-4, 장목(6목 이상) 자리는 둘 수 없습니다.</div>
        <div>• 금수 자리를 누르면 수가 무효화되며 <span class="text-emerald-400 font-medium">다른 빈자리에 다시 착수</span>할 수 있습니다.</div>
        <div>• 백돌은 금수 제한 없이 자유롭게 착수할 수 있습니다.</div>
      </div>

    </div>
  </div>

  <!-- 승리 축하 모달 -->
  <div id="winner-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-600 max-w-xs w-full text-center shadow-2xl transform scale-100">
      <div id="modal-winner-badge" class="w-14 h-14 mx-auto rounded-full mb-4 stone-black"></div>
      <h3 id="modal-winner-title" class="text-xl font-bold text-white mb-2">흑돌 승리!</h3>
      <p id="modal-winner-desc" class="text-xs text-slate-400 mb-6">오목을 완성하여 승리했습니다.</p>
      <div class="flex flex-col gap-2">
        <button id="btn-modal-review" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-white text-sm transition shadow-lg">게임 복기하기</button>
        <button id="btn-modal-restart" class="w-full py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 font-bold text-slate-200 text-sm transition">다시 시작하기</button>
      </div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 15;
    const CELL_SIZE = 36; // 15*36 = 504px
    const STAR_POINTS = [
      [3, 3], [3, 11], [7, 7], [11, 3], [11, 11]
    ];

    let boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
    let moveHistory = [];
    let currentPlayer = 1; // 1: 흑, 2: 백
    let isVsAi = false;
    let gameOver = false;

    // 복기 관련 상태 변수
    let isReviewMode = false;
    let reviewStep = 0; // 현재 복기 중 보여주고 있는 수의 인덱스 (0은 시작 직전)

    const boardEl = document.getElementById('board');
    const toastEl = document.getElementById('toast');
    const turnIndicator = document.getElementById('turn-indicator');
    const turnText = document.getElementById('turn-text');
    const moveCount = document.getElementById('move-count');
    const winnerModal = document.getElementById('winner-modal');
    const modalWinnerTitle = document.getElementById('modal-winner-title');
    const modalWinnerDesc = document.getElementById('modal-winner-desc');
    const modalWinnerBadge = document.getElementById('modal-winner-badge');
    const reviewPanel = document.getElementById('review-panel');
    const reviewStepIndicator = document.getElementById('review-step-indicator');

    // 토스트 알림창 표시 함수
    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastEl.innerText = message;
      toastEl.classList.remove('hidden', 'animate-toast');
      void toastEl.offsetWidth;
      toastEl.classList.add('animate-toast');
      toastTimeout = setTimeout(() => {
        toastEl.classList.add('hidden');
      }, 2500);
    }

    // 보드 그래픽 초기화
    function initBoardUI() {
      boardEl.innerHTML = '';

      // 격자선 생성
      for (let i = 0; i < BOARD_SIZE; i++) {
        const hLine = document.createElement('div');
        hLine.className = 'absolute grid-line';
        hLine.style.left = `${CELL_SIZE / 2}px`;
        hLine.style.right = `${CELL_SIZE / 2}px`;
        hLine.style.top = `${i * CELL_SIZE + CELL_SIZE / 2}px`;
        hLine.style.height = '1px';
        boardEl.appendChild(hLine);

        const vLine = document.createElement('div');
        vLine.className = 'absolute grid-line';
        vLine.style.top = `${CELL_SIZE / 2}px`;
        vLine.style.bottom = `${CELL_SIZE / 2}px`;
        vLine.style.left = `${i * CELL_SIZE + CELL_SIZE / 2}px`;
        vLine.style.width = '1px';
        boardEl.appendChild(vLine);
      }

      // 화점 생성
      STAR_POINTS.forEach(([r, c]) => {
        const star = document.createElement('div');
        star.className = 'absolute rounded-full bg-amber-950 pointer-events-none';
        star.style.width = '6px';
        star.style.height = '6px';
        star.style.left = `${c * CELL_SIZE + CELL_SIZE / 2 - 3}px`;
        star.style.top = `${r * CELL_SIZE + CELL_SIZE / 2 - 3}px`;
        boardEl.appendChild(star);
      });

      // 착수 인터랙션 영역 (15x15)
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'absolute flex items-center justify-center cursor-pointer transition-transform';
          cell.style.width = `${CELL_SIZE}px`;
          cell.style.height = `${CELL_SIZE}px`;
          cell.style.left = `${c * CELL_SIZE}px`;
          cell.style.top = `${r * CELL_SIZE}px`;
          cell.dataset.row = r;
          cell.dataset.col = c;

          cell.addEventListener('click', () => handleCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    // 클릭 처리 핸들러
    function handleCellClick(r, c) {
      if (gameOver || isReviewMode || boardState[r][c] !== 0) return;
      if (isVsAi && currentPlayer === 2) return;

      if (currentPlayer === 1) {
        const forbiddenReason = checkForbiddenMove(r, c, 1);
        if (forbiddenReason) {
          showToast(`⚠️ ${forbiddenReason} 자리입니다! 다른 자리에 두세요.`);
          return;
        }
      }

      executeMove(r, c);

      if (!gameOver && isVsAi && currentPlayer === 2) {
        setTimeout(playAiMove, 300);
      }
    }

    // 착수 실행
    function executeMove(r, c) {
      boardState[r][c] = currentPlayer;
      moveHistory.push({ r, c, player: currentPlayer });

      renderStones(moveHistory.length - 1);

      if (checkWin(r, c, currentPlayer)) {
        gameOver = true;
        showWinner(currentPlayer);
        return;
      }

      if (moveHistory.length === BOARD_SIZE * BOARD_SIZE) {
        gameOver = true;
        showToast("무승부입니다!");
        showWinner(0); // 무승부 모달 표시용
        return;
      }

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateUI();
    }

    // 돌 렌더링 (currentIndex까지만 돌을 표시하여 복기 기능 지원)
    function renderStones(highlightIdx = -1) {
      document.querySelectorAll('.rendered-stone').forEach(el => el.remove());

      const targetMoves = isReviewMode ? moveHistory.slice(0, reviewStep) : moveHistory;
      const activeHighlightIdx = isReviewMode ? reviewStep - 1 : highlightIdx;

      targetMoves.forEach(({ r, c, player }, idx) => {
        const stone = document.createElement('div');
        stone.className = `rendered-stone absolute rounded-full transition-transform duration-100 ${
          player === 1 ? 'stone-black' : 'stone-white'
        }`;
        stone.style.width = `${CELL_SIZE - 4}px`;
        stone.style.height = `${CELL_SIZE - 4}px`;
        stone.style.left = `${c * CELL_SIZE + 2}px`;
        stone.style.top = `${r * CELL_SIZE + 2}px`;
        stone.style.pointerEvents = 'none';

        // 마지막 착수(또는 복기 현재 단계) 위치 빨간 점 표시
        if (idx === activeHighlightIdx) {
          const marker = document.createElement('div');
          marker.className = 'w-2 h-2 rounded-full bg-red-500 mx-auto my-auto shadow-sm';
          marker.style.marginTop = `${(CELL_SIZE - 4) / 2 - 4}px`;
          stone.appendChild(marker);
        }

        boardEl.appendChild(stone);
      });

      if (isReviewMode) {
        reviewStepIndicator.innerText = `${reviewStep} / ${moveHistory.length} 수`;
      }
    }

    // 상태 UI 갱신
    function updateUI() {
      turnIndicator.className = `w-6 h-6 rounded-full ${currentPlayer === 1 ? 'stone-black' : 'stone-white'}`;
      turnText.innerText = currentPlayer === 1 ? '흑돌 차례' : '백돌 차례';
      moveCount.innerText = `${moveHistory.length} 수 진행`;
    }

    // 승리 판정 함수
    function checkWin(r, c, player) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let [dr, dc] of dirs) {
        let count = 1;
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) {
          count++; nr += dr; nc += dc;
        }
        nr = r - dr; nc = c - dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) {
          count++; nr -= dr; nc -= dc;
        }

        if (player === 1 && count === 5) return true;
        if (player === 2 && count >= 5) return true;
      }
      return false;
    }

    // 렌주룰 금수 검사
    function checkForbiddenMove(r, c, player) {
      boardState[r][c] = player;
      let reason = null;
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      let openThreeCount = 0;
      let fourCount = 0;

      for (let [dr, dc] of dirs) {
        let len = 1;
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) {
          len++; nr += dr; nc += dc;
        }
        nr = r - dr; nc = c - dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) {
          len++; nr -= dr; nc -= dc;
        }
        if (len > 5) { boardState[r][c] = 0; return "장목 (6목 이상 금지)"; }
        if (len === 5) { boardState[r][c] = 0; return null; }
      }

      for (let [dr, dc] of dirs) {
        const line = getLinePattern(r, c, dr, dc, player);
        if (isFourPattern(line)) fourCount++;
        if (isOpenThreePattern(line)) openThreeCount++;
      }

      if (fourCount >= 2) reason = "4-4 (사사 금수)";
      else if (openThreeCount >= 2) reason = "3-3 (삼삼 금수)";

      boardState[r][c] = 0;
      return reason;
    }

    function getLinePattern(r, c, dr, dc, player) {
      const line = [];
      for (let i = -4; i <= 4; i++) {
        const nr = r + dr * i;
        const nc = c + dc * i;
        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) line.push(3);
        else line.push(boardState[nr][nc]);
      }
      return line.map(v => v === player ? '1' : (v === 0 ? '0' : '2')).join('');
    }

    function isFourPattern(str) {
      return ["011110", "211110", "011112", "10111", "11011", "11101"].some(pat => str.includes(pat));
    }

    function isOpenThreePattern(str) {
      return ["01110", "010110", "011010"].some(pat => str.includes(pat));
    }

    // AI 휴리스틱
    function playAiMove() {
      let bestScore = -Infinity;
      let bestMove = null;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (boardState[r][c] !== 0) continue;

          let hasNeighbor = false;
          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] !== 0) {
                hasNeighbor = true; break;
              }
            }
            if (hasNeighbor) break;
          }
          if (!hasNeighbor && moveHistory.length > 0) continue;

          const totalScore = evaluateSpot(r, c, 2) * 1.2 + evaluateSpot(r, c, 1);
          if (totalScore > bestScore) { bestScore = totalScore; bestMove = { r, c }; }
        }
      }

      if (bestMove) executeMove(bestMove.r, bestMove.c);
    }

    function evaluateSpot(r, c, player) {
      let score = 0;
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let [dr, dc] of dirs) {
        let count = 1, block = 0;
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) { count++; nr += dr; nc += dc; }
        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || boardState[nr][nc] !== 0) block++;

        nr = r - dr; nc = c - dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === player) { count++; nr -= dr; nc -= dc; }
        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || boardState[nr][nc] !== 0) block++;

        if (count >= 5) score += 100000;
        else if (count === 4 && block === 0) score += 10000;
        else if (count === 4 && block === 1) score += 1000;
        else if (count === 3 && block === 0) score += 1000;
        else if (count === 3 && block === 1) score += 100;
        else if (count === 2 && block === 0) score += 50;
      }
      return score;
    }

    // 결과 모달 창 표시
    function showWinner(player) {
      if (player === 0) {
        modalWinnerBadge.className = `w-14 h-14 mx-auto rounded-full mb-4 bg-slate-600`;
        modalWinnerTitle.innerText = `무승부`;
        modalWinnerDesc.innerText = `승패가 나지 않았습니다.`;
      } else {
        modalWinnerBadge.className = `w-14 h-14 mx-auto rounded-full mb-4 ${player === 1 ? 'stone-black' : 'stone-white'}`;
        modalWinnerTitle.innerText = `${player === 1 ? '흑돌' : '백돌'} 승리!`;
        modalWinnerDesc.innerText = `${player === 1 ? '흑돌' : '백돌'}이 5목을 완성했습니다.`;
      }
      winnerModal.classList.remove('hidden');
    }

    // 복기 모드 진입
    function startReviewMode() {
      winnerModal.classList.add('hidden');
      isReviewMode = true;
      reviewStep = moveHistory.length; // 기본적으로 게임 끝난 최종 상태부터 시작
      reviewPanel.classList.remove('hidden');
      renderStones();
    }

    // 복기 모드 종료
    function exitReviewMode() {
      isReviewMode = false;
      reviewPanel.classList.add('hidden');
      renderStones();
    }

    // 복기 이전 수
    function reviewPrevStep() {
      if (reviewStep > 0) {
        reviewStep--;
        renderStones();
      }
    }

    // 복기 다음 수
    function reviewNextStep() {
      if (reviewStep < moveHistory.length) {
        reviewStep++;
        renderStones();
      }
    }

    // 게임 리셋 함수
    function resetGame() {
      boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
      moveHistory = [];
      currentPlayer = 1;
      gameOver = false;
      isReviewMode = false;
      winnerModal.classList.add('hidden');
      reviewPanel.classList.add('hidden');
      initBoardUI();
      renderStones();
      updateUI();
    }

    // 무르기 핸들러
    function undoMove() {
      if (gameOver || isReviewMode || moveHistory.length === 0) return;

      const undoCount = (isVsAi && moveHistory.length >= 2) ? 2 : 1;
      for (let i = 0; i < undoCount; i++) {
        const last = moveHistory.pop();
        if (last) {
          boardState[last.r][last.c] = 0;
          currentPlayer = last.player;
        }
      }
      renderStones(moveHistory.length - 1);
      updateUI();
    }

    // 이벤트 리스너 바인딩
    document.getElementById('btn-reset').addEventListener('click', resetGame);
    document.getElementById('btn-modal-restart').addEventListener('click', resetGame);
    document.getElementById('btn-modal-review').addEventListener('click', startReviewMode);
    document.getElementById('btn-undo').addEventListener('click', undoMove);
    document.getElementById('btn-review-prev').addEventListener('click', reviewPrevStep);
    document.getElementById('btn-review-next').addEventListener('click', reviewNextStep);
    document.getElementById('btn-exit-review').addEventListener('click', exitReviewMode);

    const btnPvp = document.getElementById('btn-mode-pvp');
    const btnAi = document.getElementById('btn-mode-ai');

    btnPvp.addEventListener('click', () => {
      isVsAi = false;
      btnPvp.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition';
      btnAi.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition';
      resetGame();
    });

    btnAi.addEventListener('click', () => {
      isVsAi = true;
      btnAi.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-amber-500 text-slate-950 transition';
      btnPvp.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition';
      resetGame();
    });

    // 시작
    initBoardUI();
  </script>
</body>
</html>
